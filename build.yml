# Build configuration for fylr-build-plugin — the explicit build description.
# Delivered files are listed here; "check" (runs with every build) warns when
# a manifest reference is missing from the build folder.
# All features: https://github.com/programmfabrik/fylr-build-plugin
#
# customDataTypeGfbio.zip is the name this plugin has always published. fylr updates a
# url plugin by re-fetching the url it stored at install time, so that name is
# kept as an alias beside the repository-named asset — without it every
# existing installation would stop updating, silently.

server:
  install:
  - l10n/customDataTypeGfbio.csv
webfrontend:
  coffee1:
  - webfrontend/CustomDataTypeGFBIO.coffee
  - webfrontend/CustomDataTypeGFBIOFacet.coffee
  - webfrontend/CustomDataTypeGFBIOTreeview.coffee
  - webfrontend/GFBIOUtilities.coffee
  install:
  - webfrontend/customDataTypeGfbio.css
build:
  bundles:
  - out: updater/GfbioUpdater.js
    sources:
    - src/updater/GFBIOUpdater.js
    - webfrontend/GFBIOUtilities.coffee
  zip_aliases:
  - customDataTypeGfbio.zip
